name: Atualizar finanças municipais

on:
  schedule:
    - cron: "17 7 * * 1"   # segundas, 4h17 de Brasília (o Siconfi e o IBGE mudam pouco)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: municipios
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/atualizar_municipios.py

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/municipios.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza finanças municipais ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
