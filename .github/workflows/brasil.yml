name: Atualizar painel nacional (todos os municípios)

on:
  schedule:
    - cron: "41 5 * * 4"   # toda quinta-feira (a coleta do recorte principal roda na segunda)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: municipios   # a mesma fila da coleta principal, para não somar pedidos ao Siconfi
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/brasil.py
      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brasil.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza painel nacional ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
