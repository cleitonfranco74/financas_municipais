name: Atualizar painel dos governos

on:
  schedule:
    - cron: "37 9 5 * *"   # todo dia 5
  workflow_dispatch:
  push:
    branches: [claude/sweet-albattani-q7n9og]

permissions:
  contents: write

concurrency:
  group: governos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/governos.py
      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/governos.json assets/governos
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza painel dos governos ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
