name: Atualizar dados complementares (RAIS, Caged, CNPJ, vacinação)

on:
  schedule:
    - cron: "23 6 20 * *"   # todo dia 20, depois das publicações mensais do Caged e do CNPJ
  workflow_dispatch:
    inputs:
      partes:
        description: "Partes a atualizar, separadas por espaço (vacinacao rais cnpj caged); vazio = todas"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: complementos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/complementos.py ${{ github.event.inputs.partes }}
      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/complementos.json
          if [ -f data/emprego_brasil.json ]; then git add data/emprego_brasil.json; fi
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza dados complementares ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
