name: Sonda MCMV (temporário)
on:
  push:
    branches: [claude/sweet-albattani-q7n9og]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip -q install requests
          python - <<'PY'
          import requests, io, csv, zipfile
          H={"User-Agent":"Mozilla/5.0"}
          for base in ["http://dadosabertos.cidades.gov.br","https://dadosabertos.cidades.gov.br"]:
              try:
                  r=requests.get(base+"/api/3/action/package_show?id=dados-do-programa-minha-casa-minha-vida-pmcmv",headers=H,timeout=60)
                  print("==",base,r.status_code,len(r.content))
                  if r.ok:
                      res=r.json()["result"]["resources"]; break
              except Exception as e: print("==",base,"ERRO",e)
          for rs in res: print("RES", rs.get("format"), "|", rs.get("name"), "|", rs.get("url"), "|", rs.get("size"), "|", rs.get("last_modified"))
          for rs in res:
              u=rs.get("url") or ""
              if not u.lower().split("?")[0].endswith((".csv",".zip")): continue
              try:
                  with requests.get(u,headers=H,timeout=120,stream=True) as r:
                      head=b""
                      for ch in r.iter_content(65536):
                          head+=ch
                          if len(head)>200000: break
                  print("\n### ",rs.get("name"),u,len(head))
                  if head[:2]==b"PK": print(" zip (cabeçalho só após baixar tudo)"); continue
                  txt=head.decode("latin-1")
                  for l in txt.splitlines()[:4]: print("  ",l[:600])
              except Exception as e: print(" ERRO",u,e)
          PY
