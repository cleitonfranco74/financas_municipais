name: Explorar fontes (temporário)
on:
  push:
    branches: [claude/charming-heisenberg-2sycep]
    paths: [tmp/explorar.py, .github/workflows/explorar.yml]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests openpyxl shapely
      - run: python tmp/explorar.py
        timeout-minutes: 60
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          rm -f data/malha.json; git add tmp; git commit -m "tmp: exploração" || true; git pull --rebase; git push
